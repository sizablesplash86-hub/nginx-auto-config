<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGINX Auto Config Generator</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #238636;
            --accent-hover: #2ea043;
            --code-bg: #010409;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
        }

        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: #58a6ff;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="text"], select {
            width: 100%;
            padding: 8px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #58a6ff;
        }

        pre {
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.85rem;
            line-height: 1.45;
            color: #79c0ff;
            height: 400px;
        }

        .btn-apply {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
        }

        .btn-apply:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Controls Panel -->
    <div class="card">
        <h2>NGINX Config Settings</h2>
        
        <div class="form-group">
            <label for="preset">Configuration Mode</label>
            <select id="preset" onchange="toggleFields()">
                <option value="jellyfin">Preset: Jellyfin Reverse Proxy</option>
                <option value="nextcloud">Preset: Nextcloud LEMP Stack</option>
                <option value="custom_proxy">Custom: Reverse Proxy</option>
                <option value="custom_static">Custom: Static Directory</option>
            </select>
        </div>

        <div class="form-group">
            <label for="conf_name">Config File Name</label>
            <input type="text" id="conf_name" value="jellyfin" placeholder="e.g. my-app" oninput="generateConfig()">
        </div>

        <div class="form-group">
            <label for="domain">Domain Name</label>
            <input type="text" id="domain" value="media.example.com" oninput="generateConfig()">
        </div>

        <div class="form-group" id="port-group">
            <label for="port">Target Port</label>
            <input type="text" id="port" value="8096" oninput="generateConfig()">
        </div>

        <div class="form-group" id="path-group" style="display: none;">
            <label for="path">Root Directory Path</label>
            <input type="text" id="path" value="/var/www/html" oninput="generateConfig()">
        </div>

        <div class="form-group" id="php-group" style="display: none;">
            <label for="phpver">PHP Socket / Version</label>
            <input type="text" id="phpver" value="auto" placeholder="auto or e.g. 8.2" oninput="generateConfig()">
        </div>
    </div>

    <!-- Output Panel -->
    <div class="card">
        <h2>Generated NGINX Config</h2>
        <pre id="output"></pre>
        <button class="btn-apply" onclick="applyConfig()">Apply Configuration</button>
    </div>
</div>

<script>
function toggleFields() {
    const preset = document.getElementById('preset').value;
    const portGroup = document.getElementById('port-group');
    const pathGroup = document.getElementById('path-group');
    const phpGroup = document.getElementById('php-group');
    const nameInput = document.getElementById('conf_name');

    portGroup.style.display = 'none';
    pathGroup.style.display = 'none';
    phpGroup.style.display = 'none';

    if (preset === 'jellyfin') {
        portGroup.style.display = 'block';
        document.getElementById('port').value = '8096';
        nameInput.value = 'jellyfin';
    } else if (preset === 'nextcloud') {
        phpGroup.style.display = 'block';
        pathGroup.style.display = 'block';
        document.getElementById('path').value = '/var/www/nextcloud';
        nameInput.value = 'nextcloud';
    } else if (preset === 'custom_proxy') {
        portGroup.style.display = 'block';
        nameInput.value = 'custom-proxy';
    } else if (preset === 'custom_static') {
        pathGroup.style.display = 'block';
        nameInput.value = 'custom-static';
    }

    generateConfig();
}

function generateConfig() {
    const preset = document.getElementById('preset').value;
    const domain = document.getElementById('domain').value || 'example.com';
    const port = document.getElementById('port').value || '8080';
    const path = document.getElementById('path').value || '/var/www/html';
    let phpver = document.getElementById('phpver').value || 'auto';
    
    // Default fallback display if auto is selected
    if (phpver === 'auto') {
        phpver = '8.2'; // PHP-FPM default socket fallback for preview
    }

    let config = '';

    if (preset === 'jellyfin') {
        config = `server {
    server_name ${domain};

    location / {
        proxy_pass http://127.0.0.1:${port};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Protocol $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        
        # WebSockets support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}`;
    } else if (preset === 'nextcloud') {
        config = `upstream php-handler {
    server unix:/run/php/php${phpver}-fpm.sock;
}

server {
    listen 80;
    server_name ${domain};
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ${domain};
    root ${path};

    client_max_body_size 512M;
    client_body_timeout 300s;

    location / {
        try_files $uri $uri/ /index.php$request_uri;
    }

    location ~ \\.php$ {
        include fastcgi_params;
        fastcgi_pass php-handler;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}`;
    } else if (preset === 'custom_proxy') {
        config = `server {
    server_name ${domain};

    location / {
        proxy_pass http://127.0.0.1:${port};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}`;
    } else if (preset === 'custom_static') {
        config = `server {
    server_name ${domain};
    root ${path};
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }
}`;
    }

    document.getElementById('output').textContent = config;
}

async function applyConfig() {
    const payload = {
        preset: document.getElementById('preset').value,
        name: document.getElementById('conf_name').value,
        domain: document.getElementById('domain').value,
        port: document.getElementById('port').value,
        path: document.getElementById('path').value,
        phpver: document.getElementById('phpver').value
    };

    try {
        const response = await fetch('api.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const result = await response.json();
        alert(result.message || result.error);
    } catch (err) {
        alert('Failed to connect to backend: ' + err.message);
    }
}

// Initial render
generateConfig();
</script>

</body>
</html>
